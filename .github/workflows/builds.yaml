name: 'Deterministic builds'

on:
  workflow_dispatch: null
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
  merge_group:
    types: [checks_requested]
    branches:
      - main
  push:
    branches:
      - '**/release**'
      - '**/build**'
      - main

permissions:
  contents: read

jobs:
  deterministic-build:
    name: 'deterministic-build:optional'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - project: control-panel
            artifact: control_panel.wasm.gz
          - project: station
            artifact: station.wasm.gz
          - project: upgrader
            artifact: upgrader.wasm.gz
          - project: wallet-dapp
            artifact: wallet-dapp.tar.gz
    steps:
      - name: 'Checkout'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 'Set up Docker'
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        timeout-minutes: 12
      - name: 'Deterministic build'
        run: |
          ./scripts/docker-build.sh --${{ matrix.project }}
      - name: 'Built hash'
        run: |
          cat artifacts/${{ matrix.project }}/${{ matrix.artifact }}.sha256
