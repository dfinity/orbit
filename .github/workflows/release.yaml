name: 'Release'

on:
  workflow_dispatch: null
  push:
    branches:
      - main
    paths:
      - '.release.json'

# `orbit-cli release publish` pushes the release tags and creates the GitHub
# releases, which needs contents: write and nothing else.
permissions:
  contents: write

jobs:
  release_projects:
    name: 'release'
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged # Enable Docker in Docker
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    steps:
      - name: 'Checkout'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # Kept (the default): `git push origin --tags` authenticates with the
          # token checkout leaves in .git/config.
          persist-credentials: true
      # Helps with debugging
      - name: Show versions
        run: |
          echo bash --version
          bash --version
          echo docker --version
          docker --version
      - name: 'Setup Node'
        uses: ./.github/actions/setup-node
      - name: 'Install Dependencies'
        run: pnpm install --frozen-lockfile
      - name: 'Configure Git'
        run: |
          git config --global user.email "github-actions[bot]@@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
      - name: 'If new tags, finalize release'
        run: |
          orbit-cli release publish
        env:
          GH_TOKEN: ${{ github.token }}
