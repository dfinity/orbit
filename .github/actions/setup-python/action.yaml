name: 'Setup Python'
description: 'Adds python and pip as the package installer'

runs:
  using: 'composite'
  steps:
    - name: 'Install Python'
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.10'
    - name: 'Install PIP'
      shell: bash
      run: python -m pip install --upgrade pip
